<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - Dark Mode</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Cadastro de Produto</h1>
            <form id="productForm">
                <div class="input-group">
                    <label for="productName">Nome do Produto</label>
                    <input type="text" id="productName" placeholder="Ex: Teclado Mecânico RGB" required>
                </div>

                <div class="input-group">
                    <label for="category">Categoria</label>
                    <select id="category" required>
                        <option value="" disabled selected>Selecione uma categoria</option>
                        <option value="perifericos">Periféricos</option>
                        <option value="hardware">Hardware</option>
                        <option value="monitores">Monitores</option>
                    </select>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="price">Preço (R$)</label>
                        <input type="number" id="price" step="0.01" placeholder="0,00" required>
                    </div>
                    <div class="input-group">
                        <label for="stock">Estoque</label>
                        <input type="number" id="stock" placeholder="Qtd" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="description">Descrição do Produto</label>
                    <textarea id="description" rows="4" placeholder="Descrição do produto..."></textarea>
                </div>

                <button type="submit" class="btn-register">Cadastrar Produto</button>
            </form>
        </div>
    </div>
    <script src="src/script.js"></script>
</body>
</html>
